name: Deploy to GitHub Pages

# Build automatico ad ogni push su main e pubblicazione su GitHub Pages.
# Nessun comando manuale da lanciare: basta pushare su main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # "npm ci" invece di "npm install" sarebbe più rigoroso, ma qui fallisce:
      # alcune dipendenze opzionali (@emnapi/*, usate come fallback WASM da
      # @napi-rs/wasm-runtime) vengono risolte solo su Linux e non compaiono
      # nel lockfile generato su macOS, dove esiste il binario nativo e il
      # fallback non serve. "npm install" le risolve correttamente qui.
      - run: npm install

      # --base-href usa il nome del repository, così l'URL del progetto
      # (https://<utente>.github.io/<repo>/) funziona anche se il repo
      # viene rinominato in futuro, senza dover toccare questo file.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/form-prospects/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
