<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Inizia il Tuo Percorso — Candidatura</title>
  <meta name="description" content="Candidati per iniziare il tuo percorso di crescita personale e network marketing.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Dichiara esplicitamente che la pagina gestisce da sé sia il tema
       chiaro che quello scuro. Senza questo, alcuni browser mobile (in
       particolare Samsung Internet, ma anche Chrome su Android) applicano
       un proprio filtro di "dark mode del sito" euristico sopra la nostra
       pagina quando non trovano questa dichiarazione — invertendo o
       alterando colori già pensati per entrambi i temi e producendo il
       rendering rotto visto su Samsung. Il tag va ripetuto anche come
       proprietà CSS "color-scheme" su :root (vedi styles.scss), che è il
       segnale più autorevole; il meta qui copre l'istante prima che il CSS
       sia pronto. -->
  <meta name="color-scheme" content="light dark">
  <!-- GitHub Pages non permette di impostare header HTTP personalizzati
       (niente CSP/X-Frame-Options a livello di risposta), quindi la policy
       vive qui via meta tag — copre script/stili/font/richieste, non le
       direttive che il tag <meta> non supporta (es. frame-ancestors, che va
       ignorata dai browser in questa forma). Sorgenti ammesse: il sito
       stesso, Google Fonts per i caratteri, l'API di EmailJS per l'invio. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.emailjs.com; base-uri 'self'; object-src 'none'; form-action 'self';">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
